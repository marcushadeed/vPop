[project]
name = "vpop"
version = "0.1.0"
description = "Value Productivity Over Privacy. Give an LLM access to all your data and enjoy your personal assistant!"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "lxml>=6.1.2",
    "mypy>=2.3.1",
    "pylint>=4.0.7",
    "ruff>=0.16.4",
    "sqlite-utils>=3.39",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "paths"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
]

[tool.pylint.main]
extension-pkg-allow-list = ["lxml"]
