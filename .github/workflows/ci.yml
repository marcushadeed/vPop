name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pylint src
          uv run pylint --rcfile tests/pylintrc tests
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
